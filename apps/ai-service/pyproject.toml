[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "zuti-ai-service"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # LLM (OpenRouter via OpenAI-compatible SDK)
    "openai>=1.30.0",
    # Vector DB
    "qdrant-client>=1.9.0",
    # Document processing
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    # Embeddings
    "tiktoken>=0.7.0",
    # Storage
    "boto3>=1.34.0",
    # Queue
    "redis>=5.0.0",
    # HTTP
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
