name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Zuti

            # Pull latest code
            git pull origin main

            # Install dependencies
            npx pnpm@9 install --frozen-lockfile

            # Regenerate Prisma client
            npx prisma@5 generate --schema=packages/database/prisma/schema.prisma

            # Rebuild API
            rm -rf apps/api/dist apps/api/tsconfig.tsbuildinfo
            cd apps/api && npx pnpm@9 run build && cd ../..

            # Rebuild web (with production env baked in)
            rm -rf apps/web/.next
            cd apps/web && npx pnpm@9 run build && cd ../..

            # Restart services
            pm2 restart zuti-api zuti-web zuti-ai

            pm2 save
